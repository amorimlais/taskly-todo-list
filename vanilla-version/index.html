<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Tarefas | To-Do List</title>
  <!-- Tipografia moderna via Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Folha de Estilos -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Cabeçalho da Aplicação -->
    <header class="app-header">
      <div class="header-content">
        <span class="badge-subtitle">Desafio Imersão IA</span>
        <h1 class="app-title">Minha Lista de Tarefas</h1>
        <p class="current-date" id="currentDate">Carregando data...</p>
      </div>
    </header>

    <!-- Painel de Contadores / Métricas -->
    <section class="stats-panel" aria-label="Resumo das tarefas">
      <div class="stat-card">
        <span class="stat-label">Pendentes</span>
        <span class="stat-value pending" id="pendingCount">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Concluídas</span>
        <span class="stat-value completed" id="completedCount">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Total</span>
        <span class="stat-value total" id="totalCount">0</span>
      </div>
    </section>

    <!-- Formulário de Adição de Tarefa -->
    <form class="task-form" id="taskForm" autocomplete="off">
      <div class="input-wrapper">
        <input 
          type="text" 
          id="taskInput" 
          class="task-input" 
          placeholder="O que você precisa realizar hoje?" 
          maxlength="100"
          required
        >
      </div>
      <button type="submit" class="btn-add" id="addTaskBtn" aria-label="Adicionar tarefa">
        <!-- Ícone de adição (SVG) -->
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>Adicionar</span>
      </button>
    </form>

    <!-- Filtros de Visualização -->
    <nav class="filter-tabs" aria-label="Filtrar tarefas">
      <button type="button" class="filter-btn active" data-filter="all">Todas</button>
      <button type="button" class="filter-btn" data-filter="pending">Pendentes</button>
      <button type="button" class="filter-btn" data-filter="completed">Concluídas</button>
    </nav>

    <!-- Lista de Tarefas -->
    <main class="tasks-section">
      <ul class="task-list" id="taskList" aria-live="polite">
        <!-- Itens inseridos dinamicamente via JavaScript -->
      </ul>

      <!-- Estado Vazio (quando não há tarefas) -->
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
        </div>
        <p class="empty-title">Nenhuma tarefa por aqui!</p>
        <p class="empty-subtitle">Digite uma nova tarefa acima e clique em "Adicionar" para começar.</p>
      </div>
    </main>

    <!-- Rodapé -->
    <footer class="app-footer">
      <p>Desenvolvido com <strong>HTML</strong>, <strong>CSS</strong> e <strong>JavaScript Puro</strong></p>
    </footer>
  </div>

  <!-- Script da Aplicação -->
  <script src="script.js"></script>
</body>
</html>
